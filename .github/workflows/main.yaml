name: Build and test
on:
  pull_request:
    # Run CI for any change except documentation and selected repo meta files
    paths:
      - '**'
      - '!**.md'
      - '!doc/**'
      - '!.gitignore'
      - '!codecov.yml'
      - '!LICENSE'
      - '!OWNERS'
      - '!libmilvus.spec.rpkg'
  push:
    branches:
      - master
      - '2.6'
      - '3.0'
    paths:
      - '**'
      - '!**.md'
      - '!doc/**'
      - '!.gitignore'
      - '!codecov.yml'
      - '!LICENSE'
      - '!OWNERS'
      - '!libmilvus.spec.rpkg'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the PR touches core SDK files (src, cmake, test,
  # thirdparty, scripts, workflow, lint configs) or only peripheral files
  # (examples/**). Changes limited to examples/** skip the heavy CI jobs
  # (coverage, macOS, Windows) and only run the Linux build,
  # which is enough to catch regressions in the example code itself.
  changes:
    name: Detect path changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      core_relevant: ${{ steps.filter.outputs.core_relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core_relevant:
              - '**'
              - '!examples/**'
              - '!**.md'
              - '!doc/**'
              - '!.gitignore'
              - '!codecov.yml'
              - '!LICENSE'
              - '!OWNERS'
              - '!libmilvus.spec.rpkg'

  linux:
    name: Build and test AMD64 ${{ matrix.os.distro }} ${{ matrix.os.version }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ${{ matrix.os.image }}
    # github automatically evicts no-access caches after 7 days, so we set a longer timeout to avoid unnecessary workflow timeout.
    timeout-minutes: 200
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - distro: Ubuntu
            version: 20.04
            image: ubuntu:20.04
            key: u2004
            build_shared_libs: ON
          - distro: Fedora
            version: 39
            image: fedora:39
            key: fc39
            build_shared_libs: ON
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_MAXSIZE: 2G
      BUILD_SHARED_LIBS: ${{ matrix.os.build_shared_libs }}
      UNITY: ON
      # LINE is intentionally unset here: this job builds Release, and
      # MILVUS_DEBUG_INFO only applies to Debug/RelWithDebInfo configurations.
      # The container home (/github/home) is not a stable mount; keep Conan state in
      # the workspace so the built-from-source gRPC toolchain can be cached.
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - name: Env
        run: echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Conan
        # Ubuntu 20.04 (gcc 9) has no prebuilt grpc binaries on conancenter, so the
        # dependency stack builds from source (~25 min) on every run without this cache.
        # Fedora 39 source-builds the same stack. The post-build slim step strips
        # build trees and sources so each cached home stays ~1.5 GB.
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.conan2
          key: linux-${{ matrix.os.key }}-conan-${{ github.base_ref || github.ref_name }}-${{ hashFiles('conanfile.*', 'CMakeLists.txt', 'cmake/**', 'scripts/install_deps.sh') }}
          restore-keys: linux-${{ matrix.os.key }}-conan-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-${{ matrix.os.key }}-ccache-${{ github.sha }}
          restore-keys: linux-${{ matrix.os.key }}-ccache-
      - name: Prepare
        timeout-minutes: 30
        run: |
          timeout -k 10 1800 sh scripts/install_deps.sh
      - name: Lint
        if: ${{ matrix.os.distro == 'Ubuntu' }}
        run: |
          # Release matches the dependency stack the tutorials step consumes below,
          # so one Conan cache serves the whole job.
          make lint-release
      - name: Unit Testing
        run: |
          make test-release
      - name: Build standalone tutorials
        if: ${{ matrix.os.distro == 'Ubuntu' }}
        run: |
          JOBS=4 make tutorials
      - name: Verify package
        run: |
          cmake --build cmake_build --target package --parallel 4
          sh scripts/verify_package_linux.sh cmake_build/Pack
      - name: Slim Conan cache
        # conan leaves build trees (p/b) and unpacked sources (p/s) behind after
        # --build=missing; they are dead weight on cache restore (only the final
        # package folders under p/<pkg-id> are consumed) and roughly double the
        # cache size. Remove them before the post-job cache save.
        if: always()
        run: |
          export PATH="$HOME/.venv/bin:$PATH"
          conan cache clean "*" -s -b -d || true
      - name: Prune old ccache generations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_PREFIXES: "linux-${{ matrix.os.key }}-ccache- linux-${{ matrix.os.key }}-conan-"
          KEEP_KEYS: "linux-${{ matrix.os.key }}-ccache-${{ github.sha }} linux-${{ matrix.os.key }}-conan-${{ github.base_ref || github.ref_name }}-${{ hashFiles('conanfile.*', 'CMakeLists.txt', 'cmake/**', 'scripts/install_deps.sh') }}"
        run: python3 scripts/prune_caches.py

  coverage-ubuntu:
    name: Test all with coverage
    # Skip for examples-only changes on PRs; run after pushes to warm branch-scoped caches.
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.core_relevant == 'true')
    runs-on: ubuntu-22.04
    # github automatically evicts no-access caches after 7 days, so we set a longer timeout to avoid unnecessary workflow timeout.
    timeout-minutes: 200
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 5
      # Coverage objects carry gcov sections plus line-tables debug info here (or
      # full DWARF when LINE is toggled off); 2G only held a fraction of the 200+
      # entries, crippling follow-up-commit hit rates. 8G is deliberately conservative
      # so the budget also covers full-DWARF runs; the disk cleanup step frees ~20G.
      CCACHE_MAXSIZE: 8G
      BUILD_SHARED_LIBS: OFF
      # Keep unity off here: unity batches can distort gcov/lcov per-file line
      # attribution. line-tables is safe: gcov reads .gcno/.gcda notes, not DWARF
      # (validated: identical hit/miss coverage output with full debug info).
      UNITY: OFF
      LINE: ON
      # codecov consumes lcov_output.info only; skip the genhtml report.
      COVERAGE_HTML: OFF
    steps:
      - name: Env
        run: echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ubuntu-2204-coverage-ccache-${{ github.sha }}
          restore-keys: ubuntu-2204-coverage-ccache-
      - name: Cache Conan
        # This job also builds the gRPC stack from source (its profile has no
        # conancenter binaries); the cache stores those built packages.
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ubuntu-2204-conan-${{ github.base_ref || github.ref_name }}-${{ hashFiles('conanfile.*', 'CMakeLists.txt', 'cmake/**', 'scripts/install_deps.sh') }}
          restore-keys: ubuntu-2204-conan-${{ github.base_ref || github.ref_name }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Prepare
        timeout-minutes: 30
        run: |
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99network-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
          timeout -k 10 1800 sh scripts/install_deps.sh
      - name: Testing With Coverage
        run: |
          # Static coverage links (testing-ut/it/st) exhaust BFD ld memory on hosted
          # runners; lld keeps the peak RSS low even with several links in flight.
          LDFLAGS=-fuse-ld=lld JOBS=4 CMAKE_BUILD_EXAMPLES=OFF make coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./code_coverage/lcov_output.info
          name: ubuntu-22.04-coverage
          disable_safe_directory: true
          verbose: true
      - name: Slim Conan cache
        # This job also builds the gRPC stack from source; strip the leftover build
        # trees and sources before the post-job cache save (see the matrix job).
        if: always()
        run: conan cache clean "*" -s -b -d || true
      - name: Prune old cache generations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_PREFIXES: "ubuntu-2204-coverage-ccache- ubuntu-2204-conan-"
          KEEP_KEYS: "ubuntu-2204-coverage-ccache-${{ github.sha }} ubuntu-2204-conan-${{ github.base_ref || github.ref_name }}-${{ hashFiles('conanfile.*', 'CMakeLists.txt', 'cmake/**', 'scripts/install_deps.sh') }}"
        run: python3 scripts/prune_caches.py

  macos:
    name: Build and test macOS 15
    # Skip for examples-only changes; macOS runners are scarce.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core_relevant == 'true'
    runs-on: macos-15
    # github automatically evicts no-access caches after 7 days, so we set a longer timeout to avoid unnecessary workflow timeout.
    timeout-minutes: 200
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_CPP2: true
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_MAXSIZE: 2G
      UNITY: ON
      LINE: ON
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Conan
        # This job also builds the gRPC stack from source (its profile has no
        # conancenter binaries), costing ~20 min per run without this cache.
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: macos-15-conan-${{ github.base_ref || github.ref_name }}-${{ hashFiles('conanfile.*', 'CMakeLists.txt', 'cmake/**', 'scripts/install_deps.sh') }}
          restore-keys: macos-15-conan-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ccache
          key: macos-15-ccache-${{ github.sha }}
          restore-keys: macos-15-ccache-
      - name: Prepare
        timeout-minutes: 30
        run: |
          mkdir ~/.venv
          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          # GNU timeout is not available on macOS; the step's timeout-minutes covers the limit
          sh scripts/install_deps.sh
      - name: Unit Testing
        run: |
          source ~/.venv/bin/activate
          make test
      - name: Verify package
        run: |
          source ~/.venv/bin/activate
          cmake --build cmake_build --target package --parallel 4
          sh scripts/verify_package_linux.sh cmake_build/Pack
      - name: Slim Conan cache
        # Strip leftover build trees and sources before the post-job cache save
        # (see the Linux matrix job for details).
        if: always()
        run: |
          export PATH="$HOME/.venv/bin:$PATH"
          conan cache clean "*" -s -b -d || true
      - name: Prune old ccache generations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_PREFIXES: "macos-15-ccache- macos-15-conan-"
          KEEP_KEYS: "macos-15-ccache-${{ github.sha }} macos-15-conan-${{ github.base_ref || github.ref_name }}-${{ hashFiles('conanfile.*', 'CMakeLists.txt', 'cmake/**', 'scripts/install_deps.sh') }}"
        run: python3 scripts/prune_caches.py

  windows:
    name: Build and test windows
    # Skip for examples-only changes; Windows builds are slow.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core_relevant == 'true'
    runs-on: windows-2022
    # github automatically evicts no-access caches after 7 days, so we set a longer timeout to avoid unnecessary workflow timeout.
    timeout-minutes: 200
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ccache
          key: windows-ccache-${{ github.sha }}
          restore-keys: windows-ccache-
      - name: Install dependencies on windows
        shell: cmd
        timeout-minutes: 30
        run: |
          choco install cmake ninja --no-progress
          if errorlevel 1 exit /b 1
          choco install ccache --no-progress
          if errorlevel 1 echo WARNING: ccache installation failed - build will proceed without caching
          cmake --version
          if errorlevel 1 exit /b 1
          ninja --version
          if errorlevel 1 exit /b 1
          where ccache >nul 2>&1
          if errorlevel 1 (
            echo ccache not installed - build will proceed without caching
          ) else (
            ccache --version
            if errorlevel 1 exit /b 1
          )
          exit /b 0
      - name: Build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rem Enable ccache launcher only if ccache is available. Chocolatey
          rem sometimes fails to install it (503/504 outages); without this
          rem guard every compile would try to spawn a non-existent ccache.exe
          rem and the build would die with "CreateProcess failed".
          where ccache >nul 2>&1 && (set LAUNCHER=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache) || (set LAUNCHER=)
          rem MSVC has no line-tables-only mode, so only unity build applies here.
          rem Test the optimized build configuration (release packaging itself stays
          rem with the default UNITY=OFF, so the two configurations differ there).
          cmake -S . -B build -DMILVUS_BUILD_TEST=YES -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DMILVUS_ENABLE_UNITY=ON -G Ninja %LAUNCHER%
          cmake --build build
      - name: Unit Testing
        shell: cmd
        run: |
          set PATH=%CD%\build\src;%PATH%
          rem testing-it starts an in-process mocked gRPC server and is unstable across the Windows EXE/DLL boundary.
          build\test\testing-ut
          if errorlevel 1 exit /b %errorlevel%
      - name: Verify install
        shell: cmd
        run: |
          cmake --install build --prefix build\install
          if exist build\install\bin\milvus_sdk.dll exit /b 0
          if exist build\install\bin\libmilvus_sdk.dll exit /b 0
          dir /s build\install
          exit /b 1
      - name: Verify package
        shell: pwsh
        run: |
          cmake --build build --target package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify_package_windows.ps1 build/Pack
      - name: Prune old ccache generations
        shell: bash
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_PREFIXES: "windows-ccache-"
          KEEP_KEYS: "windows-ccache-${{ github.sha }}"
        run: python scripts/prune_caches.py
